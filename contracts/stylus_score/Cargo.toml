[package]
name = "arbiscore-engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
stylus-sdk = "0.10.9"
alloy-primitives = "1.7"
alloy-sol-types = "1.7"
cfg-if = "1.0"

[dev-dependencies]
wasmparser = "0.226.0"

[features]
default = []
export-abi = ["stylus-sdk/export-abi"]
contract-client-gen = []

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "arbiscore-engine"
path = "src/main.rs"
required-features = ["export-abi"]

[profile.release]
codegen-units = 1
opt-level = "s"  # compresses ~12% smaller than "z" after wasm-opt + brotli
lto = true
panic = "abort"
strip = true
